<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="asset/img/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>短链接工具</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css">
  <style>
    body {
      background: url('https://img.city8.top/bg.jpg') center/cover fixed;
      font-family: 'Arial', sans-serif;
      color: #333;
    }

    main {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 8rem);
      text-align: center;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 10px;
      padding: 2.5rem;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      max-width: 600px;
      width: 90%;
      margin: 0 auto;
    }

    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.7);
      transition: all 0.2s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
    }

    button {
      background-color: #22c55e;
      color: white;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    button:hover {
      background-color: #16a34a;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    footer {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 0.75rem;
      text-align: center;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: #22c55e;
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.25rem;
      font-weight: 600;
    }

    .success {
      background-color: rgba(209, 250, 229, 0.9);
      color: #047857;
    }

    .error {
      background-color: rgba(254, 226, 226, 0.9);
      color: #b91c1c;
    }
  </style>
</head>

<body>
  <main>
    <div class="container">
      <h1>短链接工具 <small class="text-sm text-gray-500">v1.01</small></h1>
      
      <div x-data="app" x-cloak>
        <p x-show.transition.opacity="alert" :class="alert?.type" class="alert" x-text="alert?.message"></p>
        
        <div class="space-y-4 mb-6">
          <input placeholder="输入要缩短的网址..." x-model="url" x-ref="url" class="input-field">
          <input placeholder="自定义短链接 (可选)" x-model="slug" class="input-field">
          <input type="password" placeholder="输入管理密码..." x-model="password" class="input-field">
        </div>
        
        <details class="mb-6 border border-gray-200 rounded-lg">
          <summary class="px-4 py-2 cursor-pointer font-medium bg-gray-50 rounded-t-lg">
            自定义设置
          </summary>
          <div class="px-4 py-3 bg-gray-50 rounded-b-lg">
            <label class="block text-sm font-medium text-gray-700 mb-2">过期时间 (可选):</label>
            <select x-model="expiry" class="input-field w-full">
              <option value="">永不过期</option>
              <option value="5m">5 分钟</option>
              <option value="1h">1 小时</option>
              <option value="12h">12 小时</option>
              <option value="1d">1 天</option>
              <option value="7d">1 周</option>
            </select>
          </div>
        </details>
        
        <button 
          :disabled="loading || isValidated()" 
          @click="submit($refs, $nextTick)"
          class="w-full">
          生成
        </button>
      </div>
    </div>
  </main>

  <footer class="text-gray-600 text-sm">
    <a href="https://www.wangwangit.com" class="hover:text-green-600">特别鸣谢</a>
  </footer>

  <script src="asset/js/alpine.js"></script>
  <script>
    const app = {
      url: '',
      slug: '',
      password: '',
      expiry: '',
      alert: null,
      loading: false,
      
      isValidated() {
        return !/^https?:\/\/.{3,}/.test(this.url)
      },
      
      async submit($refs, $nextTick) {
        if (!this.url) {
          this.alert = { type: 'error', message: '请输入要缩短的网址' }
          return
        }
        
        if (this.isValidated()) {
          this.alert = { type: 'error', message: '网址格式不正确' }
          return
        }

        this.alert = null
        this.loading = true

        try {
          const res = await fetch('/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              url: this.url,
              slug: this.slug,
              password: this.password,
              expiry: this.expiry
            })
          })
          
          const data = await res.json()
          
          if (!res.ok) throw new Error(data.message || '请求失败')
          
          this.url = data.link
          $nextTick(() => {
            $refs.url.select()
            const isCopied = document.execCommand('Copy')
            this.alert = {
              type: 'success',
              message: `短链接已${isCopied ? '生成并复制' : '生成'}`
            }
          })
        } catch (err) {
          this.alert = { type: 'error', message: err.message }
        } finally {
          this.loading = false
        }
      }
    }
  </script>
</body>
</html>
